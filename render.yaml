    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm ci --prefer-offline && npm run build && npx prisma generate
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        value: postgresql://ecomzone_db_user:m3EEpuArcnq1nS0IzXC3dKnzqKUODpqv@dpg-d736u3p9fqoc73cf40vg-a/ecomzone_db_2fmp
